name: Deploy CPAL 2027 website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror Sho Sonoda portrait from personal website
        if: ${{ hashFiles('assets/images/organizers/sho-sonoda.jpg') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/organizers
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'
          curl --fail --location --silent --show-error \
            --user-agent "$UA" \
            --cookie-jar /tmp/sho-google.cookies \
            'https://sites.google.com/view/shosonoda/home' \
            --output /tmp/sho-home.html
          curl --fail --location --retry 4 --retry-delay 2 \
            --user-agent "$UA" \
            --cookie /tmp/sho-google.cookies \
            --referer 'https://sites.google.com/view/shosonoda/home' \
            --header 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' \
            'https://lh3.googleusercontent.com/sitesv/AG8ngQV0mzeNxpQgdWlNFNSB7Nsc3XmLK3LGrA0F4sczC5HaNg_l3gxEl7887Ew4y7GqXPOPDxNCP3OeP0KmoBUrmzEq0pDLKwq8stEVy_fDsQ7xyhswpUqM8gJWEABJwLqLEj7ew5UQvy8Z6WDEi6NRBLBE-d4rQ4uphN8iP0OKNVroLiiV-Czc_PZj_n3qbASBZGmth0qa_TBUG33cUDjRqkVY6M6vEXgJF-K9HtatIuI=w1280' \
            --output assets/images/organizers/sho-sonoda.jpg
          test -s assets/images/organizers/sho-sonoda.jpg
          file assets/images/organizers/sho-sonoda.jpg | grep -Ei 'JPEG|PNG|WebP|image'
          python - <<'PY'
          from pathlib import Path
          p = Path('_data/organizers.yml')
          text = p.read_text()
          old = '  photo: https://lh3.googleusercontent.com/sitesv/AG8ngQV0mzeNxpQgdWlNFNSB7Nsc3XmLK3LGrA0F4sczC5HaNg_l3gxEl7887Ew4y7GqXPOPDxNCP3OeP0KmoBUrmzEq0pDLKwq8stEVy_fDsQ7xyhswpUqM8gJWEABJwLqLEj7ew5UQvy8Z6WDEi6NRBLBE-d4rQ4uphN8iP0OKNVroLiiV-Czc_PZj_n3qbASBZGmth0qa_TBUG33cUDjRqkVY6M6vEXgJF-K9HtatIuI=w1280'
          new = '  photo: /assets/images/organizers/sho-sonoda.jpg'
          if old not in text:
              raise SystemExit('Sho Sonoda remote portrait URL not found in organizer data')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/organizers/sho-sonoda.jpg _data/organizers.yml
          git commit -m 'Host Sho Sonoda portrait locally'
          git push

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
